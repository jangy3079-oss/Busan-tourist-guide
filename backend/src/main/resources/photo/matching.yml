# [사진 담당] 사진 매칭 설정 (DATA-P05, NFR-P005)
# 값은 모두 초기값이며 평가 사진셋(DATA-P02) PoC 뒤 확정한다(SRS 3장: 숫자는 설정값, PoC 뒤 확정).
# 값을 바꾸면 아래 변경 이력에 한 줄 남긴다.
# 변경 이력:
#   2026-11-25 초기값 작성 (사진 담당)
#   2026-11-25 ocr 제한시간·재시도, narration(설명 길이·템플릿·업종 이름) 추가
#   2026-11-26 ocr.paddleUrl 추가(#41, 로컬 PaddleOCR 서버 주소)
#   2026-11-26 narration.promptLengthRatio·reminders 추가(#153, Claude 기준 프롬프트)
#   2026-11-26 narration.promptLengthRatio 언어별로(en 0.55, #153 측정에서 영어 길이 초과)
#   2026-11-26 narration.districts 추가, 영·일 템플릿은 주소 원문 대신 구 이름(#153)

image:
  allowedFormats: [jpg, jpeg, png]   # FR-P002
  maxBytes: 10485760                 # 10 MB, FR-P002
  maxLongEdgePx: 1280                # 리사이즈 기준 긴 변

ocr:
  minBlockConfidence: 0.5            # FR-P004: 이 값 미만 블록은 매칭에서 제외
  timeoutSec: 8                      # NFR-P004: 넘으면 1회 재시도, 그래도 실패면 OCR_FAIL
  maxRetry: 1
  paddleUrl: http://127.0.0.1:8866   # 로컬 PaddleOCR 서버(resources/photo/ocr-server/README.md). 환경변수 PHOTO_OCR_URL 이 있으면 그 값을 씀. 엔진 교체는 safetrip.ocr.engine

score:
  levenshteinWeight: 0.5             # 자모 편집거리 유사도 비중
  diceWeight: 0.5                    # 자모 2-gram Dice 비중
  containmentFloor: 0.9              # 한쪽 이름이 다른 쪽에 통째로 들어 있으면 텍스트 점수 하한
  containmentMinLength: 2            # 포함 규칙을 적용할 최소 길이(정규화 문자 수)
  textWeight: 0.8                    # 위치가 있을 때 텍스트 점수 비중
  distanceWeight: 0.2                # 위치가 있을 때 거리 점수 비중 (위치 없으면 텍스트만)

decision:
  confirmMin: 0.85                   # CONFIRMED: 1위 점수 하한
  confirmMargin: 0.10                # CONFIRMED: 1위-2위 차이 하한
  candidateMin: 0.60                 # CANDIDATES: 1위 점수 하한(미만이면 반경 완화, 끝까지 미만이면 NOT_FOUND)
  listMin: 0.50                      # 후보 목록에 넣을 최소 점수
  maxCandidates: 3                   # FR-P009

search:
  radiusStepsM: [500, 1500]          # FR-P006 + 반경 완화 단계. 마지막 단계 뒤에는 대상 2개 구 전체
  contentTypes: [12, 14, 38, 39]     # 관광지·문화시설·쇼핑·음식점 (FR-P006)

normalize:
  # 지점 접미어: 정규화 끝에서 한 번 제거한다(정규화된 형태로 적는다: 공백·기호 없음, 소문자)
  branchSuffixes: [본점, 직영점, 광안리점, 광안점, 해운대점, 수영점, 민락점, 남천점, 센텀점, 센텀시티점, 재송점, 우동점, 중동점, 좌동점, 송정점, 기장점]
  # OCR 혼동 문자 치환(정규화 후 적용). 왼쪽 → 오른쪽
  confusables:
    "0": o
    "|": l

narration:
  maxChars: 60                       # FR-P011: 설명 길이 상한(언어 공통)
  # LLM 에는 maxChars × 비율 글자로 알려 준다(검증은 maxChars 그대로, #144와 같은 방식)
  # en: 45자로 알려도 63~69자로 써서 길이 초과가 났다(#153 측정) → 0.55(33자)
  promptLengthRatio: { ko: 0.75, en: 0.55, ja: 0.75 }
  # 장소 원문 뒤에 붙이는 언어별 다시 지시. {maxChars}=LLM 에 알려 주는 글자 수. 상호는 한글 그대로 둔다(FR-P010)
  reminders:
    ko: "안내 문장 하나를 한국어로 {maxChars}자 이내로 쓰세요. 상호는 원문 그대로 씁니다."
    en: "Write one guide sentence in English only, at most {maxChars} characters. Keep the Korean shop name as written; no other Korean words. Shorter is better; a sentence over the limit is thrown away."
    ja: "案内文を一文、日本語だけで{maxChars}文字以内で書いてください。ハングルは店名だけ(原文のまま)。地名は「水営区」「海雲台」のように日本語表記。"
  # FR-P012 템플릿 설명. {name}=한글 원문 상호, {category}=업종(언어별 이름), {address}=주소 원문
  # 영·일은 한글 주소 원문 대신 {district}(구 이름을 그 언어로)를 쓴다. 주소 원문은 가게 정보 카드에 그대로 있다(FR-P010, #153)
  templates:
    ko: "{name}은(는) {address}에 있는 {category}입니다."
    en: "{name} is a {category} in {district}."
    ja: "{name}は{district}にある{category}です。"
  # {district}: 주소에 들어 있는 구 이름 → 언어별 표기. 어느 구도 아니면 default
  districts:
    수영구: { ko: 부산 수영구, en: "Suyeong-gu, Busan", ja: 釜山・水営区 }
    해운대구: { ko: 부산 해운대구, en: "Haeundae-gu, Busan", ja: 釜山・海雲台区 }
    default: { ko: 부산, en: Busan, ja: 釜山 }
  # 업종(place.category) 언어별 이름. 없으면 원문 그대로
  categoryNames:
    관광지: { ko: 관광지, en: tourist spot, ja: 観光地 }
    문화시설: { ko: 문화시설, en: cultural facility, ja: 文化施設 }
    쇼핑: { ko: 쇼핑 장소, en: shop, ja: ショッピングスポット }
    음식점: { ko: 음식점, en: restaurant, ja: 飲食店 }
    카페: { ko: 카페, en: cafe, ja: カフェ }
