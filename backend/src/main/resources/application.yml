spring:
  application:
    name: busan-safetrip
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/safetrip}
    username: ${DB_USER:safetrip}
    password: ${DB_PASSWORD:safetrip}
  jpa:
    hibernate:
      ddl-auto: none        # 스키마는 Flyway 로만 바꾼다
    open-in-view: false
  flyway:
    enabled: true
    out-of-order: true    # 담당별 번호 대역이라 작은 번호가 나중에 추가될 수 있다(V2 가 V30 뒤에 적용)
  servlet:
    multipart:            # 사진은 메모리에서만 처리(NFR-P002). photo/matching.yml image.maxBytes 와 맞춘다(FR-P002)
      max-file-size: 10MB
      max-request-size: 11MB
      file-size-threshold: 11MB

server:
  servlet:
    encoding:
      force-response: true   # JSON 응답에 charset=UTF-8

safetrip:
  ai:
    provider: ${AI_PROVIDER:ollama}      # ollama | openai
    base-url: ${AI_BASE_URL:http://localhost:11434}
    model: ${AI_MODEL:qwen3.5:4b}
    api-key: ${AI_API_KEY:}
    timeout-sec: 8
    max-retry: 1
    monthly-budget-krw: ${AI_MONTHLY_BUDGET_KRW:3000}      # 유료 provider 만 센다(NFR-C009)
    input-krw-per-m-tok: ${AI_INPUT_KRW_PER_MTOK:0}        # 100만 토큰당 원. 유료인데 0 이면 호출을 막는다
    output-krw-per-m-tok: ${AI_OUTPUT_KRW_PER_MTOK:0}
  tour-api:
    service-key: ${TOUR_API_KEY:}
    daily-quota: 1000
  cors:
    allowed-origins:
      - http://localhost:8099
      - http://localhost:3000
  retention:
    log-days: 30
