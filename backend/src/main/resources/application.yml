spring:
  application:
    name: busan-safetrip
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/safetrip}
    username: ${DB_USER:safetrip}
    password: ${DB_PASSWORD:safetrip}
    hikari:
      connection-timeout: 5000   # DB 가 끊겼을 때 30초 기다리지 않는다
  jpa:
    hibernate:
      ddl-auto: none        # 스키마는 Flyway 로만 바꾼다
    open-in-view: false
  flyway:
    enabled: true
    out-of-order: true    # 담당별 번호 대역이라 작은 번호가 나중에 추가될 수 있다(V2 가 V30 뒤에 적용)
  servlet:
    multipart:            # 사진은 메모리에서만 처리(NFR-P002). photo/matching.yml image.maxBytes 와 맞춘다(FR-P002)
      max-file-size: 10MB
      max-request-size: 11MB
      file-size-threshold: 11MB

logging:
  pattern:
    correlation: "[%X{requestId:-}] "   # 요청 ID(NFR-C007)

server:
  servlet:
    encoding:
      force-response: true   # JSON 응답에 charset=UTF-8

safetrip:
  ai:
    provider: ${AI_PROVIDER:claude}      # claude | openai | ollama. 기본은 Claude API, 키만 넣으면 된다
    base-url: ${AI_BASE_URL:https://api.anthropic.com}
    model: ${AI_MODEL:claude-haiku-5-5}
    api-key: ${AI_API_KEY:}
    timeout-sec: 8
    total-timeout-sec: 10     # 재시도를 포함한 총 시간(#150)
    max-retry: 1
    monthly-budget-krw: ${AI_MONTHLY_BUDGET_KRW:3000}      # 유료 provider 만 센다(NFR-C009)
    input-krw-per-m-tok: ${AI_INPUT_KRW_PER_MTOK:140}      # 100만 토큰당 원(claude-haiku-5-5). 유료인데 0 이면 호출을 막는다
    output-krw-per-m-tok: ${AI_OUTPUT_KRW_PER_MTOK:700}
  embedding:
    base-url: ${EMBED_BASE_URL:http://localhost:11434}
    model: ${EMBED_MODEL:bge-m3}
    dimension: 1024       # place_embedding 차원(V4). 모델을 바꾸면 새 마이그레이션과 전체 재생성이 필요하다
    timeout-sec: 3
  tour-api:
    base-url: https://apis.data.go.kr/B551011/KorService2
    service-key: ${TOUR_API_KEY:}
    daily-quota: 1000
    regions:              # 법정동 코드: 부산 26, 수영구 500, 해운대구 350
      - { regn-cd: "26", signgu-cd: "500" }
      - { regn-cd: "26", signgu-cd: "350" }
    content-types: { 12: 관광지, 14: 문화시설, 38: 쇼핑, 39: 음식점 }
    cafe-codes: [FD05]    # lclsSystm3 앞부분
  cors:
    allowed-origins:
      - http://localhost:8099
      - http://localhost:3000
  retention:
    log-days: 30
  emergency:
    service-key: ${NMC_API_KEY:}     # data.go.kr 인증키(국립중앙의료원 약국·응급실, 한국천문연구원 특일 정보)
    vworld-key: ${VWORLD_API_KEY:}   # V-World 좌표→주소(T16)
    holiday-key: ${KASI_API_KEY:}   # 한국천문연구원 특일 정보. 비우면 service-key 사용
