# [공용] 로컬 개발용 PostgreSQL + pgvector. 사용: docker compose up -d  (중지: docker compose down)
# 접속 정보는 backend/src/main/resources/application.yml 기본값과 같다.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: safetrip
      POSTGRES_USER: safetrip
      POSTGRES_PASSWORD: safetrip
    ports:
      - "5432:5432"
    volumes:
      - safetrip-db:/var/lib/postgresql/data
volumes:
  safetrip-db:
